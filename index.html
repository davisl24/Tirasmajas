 {slug:"labiekartosana",name:"Teritorijas labiekārtošana",short:"Zemes darbi, drenāža un īpašuma teritorijas sakārtošana.",intro:"Teritorijas sagatavošana, zemes darbi un labiekārtošanas risinājumi.",scope:["Zemes un sagatavošanas darbi","Drenāžas risinājumi","Teritorijas sakārtošana un labiekārtošana"]}

const nav=[["Sākums","#/"],["Pakalpojumi","#/pakalpojumi"],["Par mums","#/par-mums"],["Mūsu darbi","#/musu-darbi"],["Kontakti","#/kontakti"]];
const app=document.getElementById("app"),desktopNav=document.getElementById("nav"),mobileNav=document.getElementById("mobileNav"),menuBtn=document.getElementById("menuToggle");
function btn(text,href,klass){return '<a class="btn'+(klass?' '+klass:'')+'" href="'+href+'">'+text+'</a>';}
function serviceRows(){return '<div class="service-list folder-grid">'+services.map(function(s,i){return '<a class="service-row folder-card" href="#/pakalpojumi/'+s.slug+'" aria-label="'+s.name+' — apskatīt pakalpojumu"><div class="folder-visual" aria-hidden="true"></div><div class="folder-panel"><span class="folder-arrow" aria-hidden="true">↗</span><h3>'+s.name+'</h3><p>'+s.short+'</p></div></a>';}).join('')+'</div>';}
function processSection(){return '<section class="section process" id="sadarbiba"><div class="wrap process-layout"><div class="process-copy"><h2>Kā sākas sadarbība</h2></div><div class="process-steps"><span class="process-progress" aria-hidden="true"></span><div class="process-step"><div><h3>Pastāstiet par darbu</h3><p>Norādiet interesējošo pakalpojumu, objekta atrašanās vietu un īsu darba aprakstu.</p></div></div><div class="process-step"><div><h3>Objekta izvērtēšana</h3><p>Tiek precizēts nepieciešamais darba apjoms un, ja vajadzīgs, apsekošanas iespējas.</p></div></div><div class="process-step"><div><h3>Piedāvājums</h3><p>Pēc situācijas izvērtēšanas var vienoties par tālāko darbu un izmaksu aprēķinu.</p></div></div></div></div></section>';}
function form(){return '<form class="contact-form" id="demoForm"><div class="field"><label for="contact-name">Vārds</label><input id="contact-name" name="name" autocomplete="name" placeholder="Jūsu vārds" required></div><div class="field"><label for="contact-phone">Telefons</label><input id="contact-phone" name="phone" type="tel" autocomplete="tel" placeholder="+371 ..." required></div><div class="field full"><label for="contact-service">Nepieciešamais pakalpojums</label><select id="contact-service" name="service" required><option value="">Izvēlieties pakalpojumu</option>'+services.map(function(s){return '<option value="'+s.slug+'">'+s.name+'</option>';}).join('')+'<option value="cits">Cits / vēl nezinu</option></select></div><div class="field full"><label for="contact-location">Objekta atrašanās vieta</label><input id="contact-location" name="location" placeholder="Pilsēta vai novads"></div><div class="field full"><label for="contact-message">Īsi par nepieciešamajiem darbiem</label><textarea id="contact-message" name="message" placeholder="Kas jāizbūvē vai jāsakārto?"></textarea></div><button class="btn dark" type="submit">Pārbaudīt pieteikuma formu <span class="btn-arrow" aria-hidden="true">↗</span></button><p class="form-note">Demo versija: ievadītie dati netiek nosūtīti vai saglabāti. Reālā pieteikšanās tiks pieslēgta pēc saskaņošanas.</p><p class="form-status" id="formStatus" role="status" aria-live="polite" hidden></p></form>';}
function contactSection(standalone=false){return '<section class="section contact'+(standalone?' contact-standalone':'')+'" id="pieteikums"><div class="wrap contact-layout"><div class="contact-copy"><h2>Plānojat darbus savā īpašumā?</h2><p class="contact-note"><a href="tel:+37126494261">+371 26494261</a></p></div>'+form()+'</div></section>';}
function workCard(i){return '<article class="work-item"><div class="work-media" role="img" aria-label="Vieta reālai paveiktā darba fotogrāfijai">Darba foto · 0'+i+'</div><div class="work-meta"><span>Darba piemērs 0'+i+'</span><span>Apraksts tiks pievienots</span></div></article>';}
function worksSection(){return '<section class="section works" id="musu-darbi"><div class="wrap"><div class="section-head"><h2>Mūsu darbi</h2></div><div class="works-grid">'+[1,2,3].map(workCard).join('')+'</div><div class="works-link">'+btn("Apskatīt visus darbus","#/musu-darbi","dark")+'</div></div></section>';}
function worksPage(){return subHero("Mūsu darbi","")+'<section class="section works" id="visi-darbi"><div class="wrap"><div class="works-page-action">'+btn("Apskatīt visus darbus","#visi-darbi","dark")+'</div><div class="works-grid full">'+[1,2,3,4].map(workCard).join('')+'</div></div></section>'+reviewsDemo()+contactSection();}
function reviewsDemo(){const reviews=[{quote:"Manam īpašumam vajadzēja izveidot kanalizāciju. Puiši to izdarīja gan ēkas iekšienē, gan ārā. Darbs paveikts izcili un pēc darba teritorija sakopta.",author:"Andris",place:"Saulkrasti"},{quote:"Kā palīgus īpašuma teritorijas sakopšanā, komunikāciju atjaunošanā un citos darbos izvēlējos Tīras Mājas komandu. Darbs paveikts ātri un precīzi.",author:"Santa",place:"Mārupe"},{quote:"Puišiem var uzdot visa veida jautājumus. Pārsteidza tas, ka darbus izdarīja ļoti ātri, un rezultāts ir fantastisks.",author:"Mareks",place:"Valmiera"}];return '<section class="section reviews-demo"><div class="wrap"><div class="section-head"><h2>Klientu atsauksmes</h2></div><div class="review-grid">'+reviews.map(r=>'<article class="review-card"><p>“'+r.quote+'”</p><span class="review-person"><span class="review-avatar">'+r.author.charAt(0)+'</span><span>'+r.author+' · '+r.place+'</span></span></article>').join('')+'</div></div></section>';}
function aboutSection(){return '<section class="section about" id="par-mums"><div class="wrap about-layout"><div class="about-intro"><div class="about-photo">Vieta uzņēmuma darba foto</div><h2>Par mums</h2><p>Tīras Mājas piedāvā ūdensapgādes, kanalizācijas, apkures un santehnikas sistēmu izbūvi, remontu un apkopi.</p><a class="about-link" href="#/par-mums">Vairāk par uzņēmumu →</a></div><div class="about-facts"><div><h3>Objekta apsekošana un tāme</h3><p>Iepriekšējā mājaslapā norādīta bezmaksas apsekošana un tāmes sagatavošana.</p></div><div><h3>Izbūve, remonts un apkope</h3><p>Uzņēmuma iepriekšējā vietnē minētie darbu virzieni.</p></div><div><h3>Darbi visā Latvijā</h3><p>Iepriekšējā vietnē norādītā pakalpojumu teritorija.</p></div></div></div></section>';}
function aboutPage(){return subHero("Par mums","")+'<section class="section about"><div class="wrap about-layout"><div class="about-intro"><div class="about-photo">Vieta uzņēmuma darba foto</div><h2>Inženiertīkli un zemes darbi</h2><p>Uzņēmuma darbības virzieni ir ūdensapgāde, kanalizācija, apkure, santehnika un teritorijas darbi.</p></div><div class="about-facts"><div><h3>Objekta apsekošana</h3><p>Objektam piemēroto risinājumu un tāmi precizē pēc izvērtēšanas.</p></div><div><h3>Remonts un apkope</h3><p>Iepriekšējā mājaslapā minēti arī sistēmu remonta un apkopes darbi.</p></div></div></div></section>'+worksSection();}
function home(){return '<section class="hero"><div class="wrap hero-inner"><h1>Inženiertīklu izbūve <strong>un zemes darbi</strong></h1><div class="hero-intro"><p>Kanalizācijas, ūdensapgādes un apkures sistēmas, kā arī teritorijas labiekārtošana. Atrodiet vajadzīgo pakalpojumu un piesakiet objekta izvērtēšanu.</p><div class="hero-actions">'+btn("Pieteikt apsekošanu","#/kontakti","")+btn("Apskatīt pakalpojumus","#pakalpojumi","ghost no-arrow")+'</div></div></div></section><section class="section services" id="pakalpojumi"><div class="wrap"><div class="section-head"><h2>Pakalpojumi</h2><p></p></div>'+serviceRows()+'</div></section>'+aboutSection()+worksSection()+reviewsDemo()+processSection();}
function subHero(title,desc,variant=''){return '<section class="subhero'+(variant?' '+variant:'')+'"><div class="wrap"><h1>'+title+'</h1>'+(desc?'<p>'+desc+'</p>':'')+'</div></section>';}
function servicesPage(){return subHero("Pakalpojumi","","service-subhero")+'<section class="section services-directory services"><div class="wrap"><div class="section-head"><h2>Atrodiet vajadzīgo darbu</h2><p></p></div>'+serviceRows()+'</div></section>'+contactSection();}
function detailPage(slug){const s=services.find(function(x){return x.slug===slug;});if(!s)return notFound();return subHero(s.name,"")+'<section class="section"><div class="wrap detail-layout"><div><h2>Ko ietver šis pakalpojums</h2>'+btn("Pieteikt apsekošanu","#/kontakti","dark horizontal-arrow")+'</div><div><ul class="detail-list">'+s.scope.map(function(item){return '<li>'+item+'</li>';}).join('')+'</ul><div class="next-project"><a href="#/pakalpojumi">← Visi pakalpojumi</a></div></div></div></section>'+contactSection();}
function contactsPage(){return contactSection(true);}
function notFound(){return subHero("Lapa nav atrasta","Šāda lapa demo versijā nav pieejama.")+'<section class="section"><div class="wrap">'+btn("Atgriezties sākumlapā","#/","dark")+'</div></section>';}
function pathNow(){let raw=location.hash.slice(1);if(!raw||raw[0]!=="/")return "";return decodeURIComponent(raw.slice(1).split("?")[0]);}
function closeMenu(){mobileNav.classList.remove("open");menuBtn.setAttribute("aria-expanded","false");menuBtn.setAttribute("aria-label","Atvērt izvēlni");}
function render(){let parts=pathNow().split("/").filter(Boolean);let section=parts[0]||"";app.innerHTML=!section?home():section==="pakalpojumi"?(parts[1]?detailPage(parts[1]):servicesPage()):section==="musu-darbi"?worksPage():section==="par-mums"?aboutPage():section==="kontakti"?contactsPage():notFound();document.title=(section==="pakalpojumi"?"Pakalpojumi — ":"")+ "Tīras Mājas — demo";desktopNav.innerHTML=nav.map(function(n){const link='<a href="'+n[1]+'"'+((!section&&n[1]==="#/")||(section&&n[1]==="#/"+section)?' aria-current="page"':'')+'>'+n[0]+'</a>';return n[0]==="Pakalpojumi"?'<div class="nav-service-group">'+link+'<div class="nav-service-menu">'+services.map(s=>'<a href="#/pakalpojumi/'+s.slug+'">'+s.name+'</a>').join('')+'</div></div>':link;}).join("");mobileNav.innerHTML=nav.map(function(n){return '<a href="'+n[1]+'">'+n[0]+'</a>';}).join("")+btn("Pieteikt apsekošanu","#/kontakti","");closeMenu();const theForm=document.getElementById("demoForm");if(theForm)theForm.addEventListener("submit",function(ev){ev.preventDefault();const status=document.getElementById("formStatus");status.hidden=false;status.textContent="Demonstrācijas režīms: pieteikums netika nosūtīts. Reālajai lapai tiks pieslēgta pieteikumu saņemšana.";});window.scrollTo({top:0,behavior:"instant"});requestAnimationFrame(updateProcessProgress);}
document.addEventListener("click",function(e){const a=e.target.closest('a[href="#pieteikums"],a[href="#pakalpojumi"]');if(a){let target=document.querySelector(a.getAttribute("href").replace("#","#"));if(target){e.preventDefault();target.scrollIntoView({behavior:window.matchMedia("(prefers-reduced-motion: reduce)").matches?"instant":"smooth"});}}});
menuBtn.addEventListener("click",function(){let open=mobileNav.classList.toggle("open");menuBtn.setAttribute("aria-expanded",String(open));menuBtn.setAttribute("aria-label",open?"Aizvērt izvēlni":"Atvērt izvēlni");});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeMenu();});
function updateProcessProgress(){const wrap=document.querySelector(".process-steps");if(!wrap)return;const steps=[...wrap.querySelectorAll(".process-step")];if(!steps.length)return;const first=steps[0].offsetTop+10,last=steps[steps.length-1].offsetTop+10;const marker=window.innerHeight*.52-wrap.getBoundingClientRect().top;const nearest=steps.reduce((best,step,i)=>Math.abs(step.offsetTop+10-marker)<Math.abs(steps[best].offsetTop+10-marker)?i:best,0);wrap.style.setProperty("--active-step",String(nearest));wrap.style.setProperty("--dot-y",Math.max(first,Math.min(last,steps[nearest].offsetTop+10))+"px");steps.forEach((step,i)=>step.classList.toggle("is-active",i===nearest));}
window.addEventListener("scroll",updateProcessProgress,{passive:true});window.addEventListener("resize",updateProcessProgress);
document.addEventListener("click",function(event){const link=event.target.closest('a[href^="#/"]');if(!link)return;const to=link.getAttribute("href");if(!to)return;event.preventDefault();if(location.hash!==to){location.hash=to;}else{render();}});
window.addEventListener("hashchange",render);
render();
})();
</script></body></html>
