/* V2 editorial refinement: clear hierarchy without generic cards */
:root{--paper:#f6f5f1;--ink:#20211f;--line:#d7d7d0;--muted:#646861}
body{letter-spacing:-.012em}
.header{box-shadow:0 4px 22px #0000000c;border-color:#e9e8e3}
.brand{letter-spacing:-.025em}
.hero{min-height:91svh;background:#282925}
.hero-content{padding-top:192px;padding-bottom:118px}
.hero h1{font-size:clamp(44px,5.25vw,70px);line-height:1.105;letter-spacing:-.056em;max-width:800px;margin:21px 0}
.hero-lead{max-width:445px}
.hero-media{background:#383934}
.hero-media:after{background:linear-gradient(90deg,#171815e8 0%,#171815ba 47%,#17181542 100%)}
.photo-label{font-size:10px;color:#d0d1c8}
.section{padding:clamp(68px,8vw,112px) 0}
.section-heading{align-items:start;gap:56px;margin-bottom:41px}
.section-heading h2{letter-spacing:-.048em}
.section-heading .small{color:#8b8d84}

.service-row{grid-template-columns:54px minmax(0,1fr) 240px 25px;padding:35px 0;gap:26px}
.service-row h3{font-size:clamp(22px,2.5vw,31px);font-weight:600;letter-spacing:-.045em}
.service-row:hover{padding-left:0;background:#f7f6f25c}
.service-row .arrow{transition:transform .18s}
.service-row:hover .arrow{transform:translate(3px,-3px)}
.media-placeholder{background:#e5e4df;color:#73766f;min-height:380px;font-size:11px;letter-spacing:.04em;text-transform:none}
.media-placeholder.tall{min-height:480px}
.evidence-layout{grid-template-columns:.95fr 1.05fr;gap:clamp(40px,7vw,100px)}
.evidence-items{margin-top:37px}

.project-grid{grid-template-columns:1.28fr 1fr;gap:30px}
.project-grid .project:first-child .media-placeholder{height:600px}
.project .media-placeholder{height:257px}
.project-meta{padding-top:13px}
.dark{background:#1e201d}
.steps{border-top:1px solid #666962}
.step{min-height:155px}
.step h3{font-size:19px;margin:32px 0 6px}
.quote-layout{grid-template-columns:.7fr 1fr;gap:100px}
.quote-placeholder{border-top:1px solid var(--line);border-bottom:0;padding:26px 0}
.quote-placeholder p{font-size:17px;max-width:470px}
.contact-form{background:#f7f6f2;padding:36px}
.field input,.field select,.field textarea{border-radius:2px}
.page-hero{background:#20221f}
@media(max-width:900px){.service-row{grid-template-columns:37px minmax(0,1fr) 25px}.service-row p{display:none}.project-grid .project:first-child .media-placeholder{height:480px}.quote-layout{gap:35px}}

/* Simplified process only: no vertical separators, compact editorial hierarchy. */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px;border-top:1px solid #666962;margin-top:32px}
.step,.step:not(:first-child){border:0;min-height:0;padding:24px 0 4px}

/* Content-first clarity refinements, keeping the existing structure */
.hero h1{max-width:780px;text-wrap:balance}

</style></head><body>
<header class="header"><a class="brand" href="#/" aria-label="Tīras Mājas sākumlapa"><i aria-hidden="true"></i>TĪRAS MĀJAS</a><nav class="nav" id="nav" aria-label="Galvenā navigācija"></nav><a href="#/kontakti" class="btn">Pieteikt apsekošanu <span aria-hidden="true">↗</span></a><button class="menu-button" id="menuToggle" aria-label="Atvērt izvēlni" aria-expanded="false">☰</button></header><nav class="mobile-nav" id="mobileNav" aria-label="Mobilā navigācija"></nav>
<main id="app"></main>
<footer class="footer"><div class="wrap"><div class="footer-main"><a class="brand" href="#/"><i aria-hidden="true"></i>TĪRAS MĀJAS</a><div class="footer-links"><a href="#/">Sākums</a><a href="#/pakalpojumi">Pakalpojumi</a><a href="#/musu-darbi">Mūsu darbi</a><a href="#/kontakti">Kontakti</a></div></div><div class="footer-bottom"><span>© Tīras Mājas · Dizaina demo</span><span>Kontaktinformācija un juridiskie dati tiks pievienoti pirms publicēšanas.</span></div></div></footer><div class="demo-label">DEMO · NAV PUBLICĒŠANAI</div><div class="demo-message" id="notice" role="status" aria-live="polite"></div>
<script>
const services=[{slug:'kanalizacija',name:'Kanalizācijas izbūve'},{slug:'udensapgade',name:'Ūdensapgāde'},{slug:'apkure',name:'Apkures sistēmas'},{slug:'labiekartosana',name:'Teritorijas labiekārtošana'}];
const linkset=[['Sākums','#/'],['Pakalpojumi','#/pakalpojumi'],['Mūsu darbi','#/musu-darbi'],['Kontakti','#/kontakti']];
const media=(text='Vieta reālam objekta foto',cls='')=>`<div class="media-placeholder ${cls}" role="img" aria-label="${text}"><span>${text}</span></div>`;
const label=(name,title,aside='')=>`<div class="section-heading"><div><div class="small muted">${name}</div><h2>${title}</h2></div>${aside?`<p>${aside}</p>`:''}</div>`;
const serviceRows=()=>`<div class="service-list">${services.map((s,i)=>`<a class="service-row" href="#/pakalpojumi/${s.slug}"><span class="count">0${i+1}</span><h3>${s.name}</h3><p>Atvērt pakalpojuma aprakstu</p><span class="arrow" aria-hidden="true">↗</span></a>`).join('')}</div>`;
const project=(i)=>`<div class="project">${media('Objekta foto '+String(i).padStart(2,'0'))}<div class="project-meta"><span>Darba piemērs 0${i}</span><span>Apraksts tiks pievienots</span></div></div>`;
const projectGrid=(n=3)=>`<div class="${n>3?'page-grid':'project-grid'}">${Array.from({length:n},(_,i)=>project(i+1)).join('')}</div>`;
const process=()=>`<div class="steps">${['Pieteikums','Apsekošana','Tāme','Darbu izpilde'].map((n,i)=>`<div class="step"><span class="small">0${i+1}</span><h3>${n}</h3></div>`).join('')}</div><p class="process-disclaimer">Procesa detaļas precizēsim ar uzņēmumu pirms publicēšanas.</p>`;
const form=()=>`<form class="contact-form" id="demoForm"><div class="field"><label for="fullName">Vārds</label><input id="fullName" name="name" required placeholder="Vārds"></div><div class="field"><label for="phone">Telefons</label><input id="phone" name="phone" type="tel" required placeholder="Tālruņa numurs"></div><div class="field"><label for="service">Pakalpojums</label><select id="service" name="service" required><option value="">Izvēlies pakalpojumu</option>${services.map(s=>`<option>${s.name}</option>`).join('')}</select></div><div class="field"><label for="location">Objekta atrašanās vieta</label><input id="location" name="location" placeholder="Pilsēta vai novads"></div><div class="field"><label for="detail">Darbu apraksts</label><textarea id="detail" name="detail" placeholder="Īss darbu apraksts"></textarea></div><button class="btn dark" type="submit">Pieteikt apsekošanu ↗</button><p class="form-note">Demo režīms. Ievadītie dati netiek nosūtīti vai saglabāti.</p></form>`;
const contactsSection=()=>`<section class="section dark" id="pieteikums"><div class="wrap contact-panel"><div><div class="small" style="color:var(--yellow)">PIETEIKUMS</div><h2>Pieteikt apsekošanu</h2><p>Norādi interesējošo pakalpojumu, objekta atrašanās vietu un tālruņa numuru. Šī ir demonstrācijas forma.</p></div>${form()}</div></section>`;
const home=()=>`<section class="hero"><div class="hero-media" aria-hidden="true"></div><div class="photo-label">Vieta uzņēmuma objekta fotogrāfijai</div><div class="wrap hero-content"><div class="small">INŽENIERKOMUNIKĀCIJAS / BŪVDARBI</div><h1>Inženierkomunikāciju izbūve</h1><p>Kanalizācija, ūdensapgāde, apkure un teritorijas labiekārtošana. Izvēlies vajadzīgo pakalpojumu un piesaki apsekošanu.</p><div class="hero-actions"><a href="#pieteikums" class="btn" data-scroll-form>Pieteikt apsekošanu ↗</a><a href="#/pakalpojumi" class="btn outline">Pakalpojumi ↗</a></div></div></section>
<section class="section white" id="services"><div class="wrap">${label('01 / Pakalpojumi','Ko mēs darām','Apskati darbu virzienus un atrodi sev nepieciešamo.')}${serviceRows()}</div></section>
<section class="section"><div class="wrap evidence-layout"><div>${label('02 / Par uzņēmumu','Kāpēc izvēlēties mūs')}<p class="muted">Pirms darbu uzsākšanas svarīgi saprast iespējamo risinājumu un tāmi.</p><div class="evidence-items"><div>Darbu piemēri — galerijā</div><div>Darbu nosacījumi — precizējami</div><div>Apsekošanas pieteikums — kontaktformā</div></div></div>${media('Vieta autentiskai darba fotogrāfijai','tall')}</div></section>
<section class="section white"><div class="wrap">${label('03 / Paveiktie darbi','Paveiktie darbi','Objektu fotogrāfijām un īsiem darbu aprakstiem.')}${projectGrid()}<div style="margin-top:30px"><a class="btn dark" href="#/musu-darbi">Visi darbi ↗</a></div></div></section>
<section class="section dark"><div class="wrap">${label('04 / Sadarbība','Kā notiek darbi')}${process()}</div></section>
<section class="section"><div class="wrap quote-layout"><div>${label('05 / Atsauksmes','Klientu pieredze')}</div><div class="quote-placeholder"><p>Klientu atsauksmes pievienosim pēc to apstiprināšanas.</p><span class="small">Jāsaņem uzņēmuma materiāli</span></div></div></section>${contactsSection()}`;
const subHero=(crumb,title,desc)=>`<section class="page-hero"><div class="wrap"><div class="small">${crumb}</div><h1>${title}</h1><p>${desc}</p></div></section>`;
const servicesPage=()=>subHero('Pakalpojumi','Mūsu pakalpojumi','Pārskats par darbu kategorijām. Precīzie apraksti tiks saskaņoti ar uzņēmumu.')+`<section class="section white"><div class="wrap">${serviceRows()}</div></section>`+contactsSection();
const detailPage=slug=>{const s=services.find(x=>x.slug===slug);if(!s)return missing();return subHero('Pakalpojumi / '+s.name,s.name,'Šeit būs apstiprināts pakalpojuma apraksts un informācija par darbu veidiem.')+`<section class="section white"><div class="wrap two-col"><div>${label('Pakalpojums','Ko ietver darbi')}<ul class="detail-items"><li>Darbu veids — jāprecizē</li><li>Darbu apjoms — jāprecizē</li><li>Objekta prasības — jāprecizē</li></ul></div>${media('Vieta šī pakalpojuma darba foto','tall')}</div></section><section class="section"><div class="wrap">${label('Paveiktie darbi','Atbilstošie projekti')}${projectGrid(2)}</div></section><section class="section dark"><div class="wrap">${label('Process','Kā notiek sadarbība')}${process()}</div></section>`+contactsSection()};
const worksPage=()=>subHero('Projekti','Mūsu darbi','Reālu paveikto darbu galerijai paredzēta vieta.')+`<section class="section white"><div class="wrap">${projectGrid(6)}</div></section>`+contactsSection();
const contactPage=()=>subHero('Saziņa','Kontakti','Atstāj pieprasījumu, un uzņēmums varēs sazināties ar tevi, kad būs pieslēgta īstā forma.')+`<section class="section white"><div class="wrap info-grid"><div>${label('Saziņa','Kontaktinformācija')}<ul class="detail-items"><li>Telefons — jāapstiprina</li><li>E-pasts — jāapstiprina</li><li>Apkalpošanas teritorija — jāapstiprina</li></ul></div>${media('Vieta uzņēmuma fotogrāfijai')}</div></section>`+contactsSection();
const missing=()=>subHero('404','Lapa nav atrasta','Atgriezies sākumlapā.');
function render(){const route=decodeURI(location.hash.replace(/^#\//,'').split('?')[0]),parts=route.split('/').filter(Boolean);let content=!parts.length?home():parts[0]==='pakalpojumi'?(parts[1]?detailPage(parts[1]):servicesPage()):parts[0]==='musu-darbi'?worksPage():parts[0]==='kontakti'?contactPage():missing();document.querySelector('#app').innerHTML=content;document.querySelector('#nav').innerHTML=linkset.map(([n,href])=>`<a href="${href}" ${(!parts.length&&href==='#/'||parts[0]&&href.includes(parts[0]))?'aria-current="page"':''}>${n}</a>`).join('');document.querySelector('#mobileNav').innerHTML=linkset.map(([n,href])=>`<a href="${href}">${n}</a>`).join('')+`<a class="btn" href="#/kontakti">Pieteikt apsekošanu ↗</a>`;document.querySelector('#mobileNav').classList.remove('open');document.querySelector('#menuToggle').setAttribute('aria-expanded','false');const form=document.querySelector('#demoForm');if(form)form.addEventListener('submit',e=>{e.preventDefault();notice('Šis ir demo — pieteikums netika nosūtīts.')});document.querySelectorAll('[data-scroll-form]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();document.querySelector('#pieteikums')?.scrollIntoView({behavior:'smooth'});}));window.scrollTo(0,0)}
function notice(s){const el=document.querySelector('#notice');el.textContent=s;el.style.display='block';setTimeout(()=>el.style.display='none',3800)}
document.querySelector('#menuToggle').addEventListener('click',()=>{const nav=document.querySelector('#mobileNav');const open=nav.classList.toggle('open');document.querySelector('#menuToggle').setAttribute('aria-expanded',String(open))});window.addEventListener('hashchange',render);render();
</script></body></html>
