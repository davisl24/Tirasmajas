<!doctype html>
<html lang="lv">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tīras Mājas — struktūras demo</title>
<style>
:root{--ink:#172220;--muted:#68736e;--line:#e7eae6;--bg:#f8f9f6;--white:#fff;--green:#274f42;--light:#edf2ed;--radius:22px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font:15px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button{cursor:pointer}.container{width:min(1150px,calc(100% - 54px));margin:auto}.pill{border-radius:100px}.nav-shell{position:sticky;top:15px;z-index:10;padding-top:15px}.nav{height:70px;display:flex;align-items:center;gap:30px;padding:0 14px 0 23px;border:1px solid #e3e8e3;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);box-shadow:0 10px 35px #1728200d;border-radius:90px}.logo{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:780;white-space:nowrap;letter-spacing:-.5px}.mark{display:grid;place-items:center;width:31px;height:31px;border-radius:10px;background:#274f42;color:white;font-size:19px;font-weight:600}.links{display:flex;align-items:center;gap:24px;margin:auto;font-size:13px;font-weight:550}.links a{color:#58625d;transition:color .2s}.links a:hover,.links a.active{color:#173d30}.cta{border:0;color:white;background:var(--green);border-radius:100px;padding:13px 21px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:11px;white-space:nowrap}.cta:hover{background:#173c30}.cta.secondary{background:white;color:var(--ink);border:1px solid var(--line)}.hamb{display:none;border:0;background:transparent;padding:8px;font-size:22px}main{min-height:78vh}.hero{min-height:670px;padding:106px 0 85px;display:grid;grid-template-columns:1fr 1.03fr;align-items:center;gap:65px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#668174;font-weight:700}.hero h1{font-size:clamp(50px,6vw,85px);letter-spacing:-5px;line-height:1.05;margin:20px 0 18px;font-weight:650}.hero p{font-size:17px;line-height:1.7;color:var(--muted);max-width:430px}.actions{display:flex;gap:10px;align-items:center;margin-top:30px;flex-wrap:wrap}.placeholder{border-radius:var(--radius);background:linear-gradient(135deg,#e5ebe3,#d8e3da);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#84988a}.placeholder:after{content:'';position:absolute;inset:10px;border:1px dashed #b9c7bb;border-radius:16px}.placeholder span{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;font-weight:600;z-index:1;text-align:center;padding:15px}.hero-img{height:475px;border-radius:36px}.section{padding:105px 0}.section.alt{background:white}.section-head{max-width:730px;margin-bottom:38px}.section-head h2{font-size:clamp(35px,4vw,53px);font-weight:640;letter-spacing:-2.3px;line-height:1.15;margin:13px 0}.section-head p{color:var(--muted);font-size:15px}.grid{display:grid;gap:18px}.grid.four{grid-template-columns:repeat(4,1fr)}.grid.three{grid-template-columns:repeat(3,1fr)}.grid.two{grid-template-columns:repeat(2,1fr)}.service{background:white;border:1px solid var(--line);padding:11px;border-radius:24px;transition:transform .2s,box-shadow .2s}.service:hover{transform:translateY(-4px);box-shadow:0 20px 38px #1728200c}.service .placeholder{height:173px;border-radius:16px}.service-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 8px 9px}.service strong{font-size:14px;font-weight:640}.arrow{border-radius:100px;background:var(--light);width:32px;height:32px;display:grid;place-items:center;color:var(--green)}.trust{padding:30px;border-radius:23px;background:#f6f8f5;min-height:170px;border:1px solid #edf0eb}.trust .num{color:#809589;font-size:23px;font-weight:450}.trust strong{display:block;margin:18px 0 7px;font-size:16px}.trust small{color:var(--muted)}.project{display:block}.project .placeholder{height:270px}.project p{font-weight:630}.process{display:grid;grid-template-columns:repeat(4,1fr);gap:17px}.step{padding:25px 22px;border-radius:22px;background:#f7f9f6;border:1px solid #edf1ed}.step small{color:#90a397}.step h3{margin:39px 0 8px;font-weight:630;font-size:17px}.step p{font-size:13px;color:var(--muted);margin:0}.quote{background:#f8f9f6;padding:26px;border-radius:24px;border:1px solid var(--line);min-height:165px}.quote .bars{display:grid;gap:12px;margin-bottom:25px}.bar{display:block;background:#dde4dc;height:9px;border-radius:30px;width:95%}.bar.short{width:52%}.quote strong{font-weight:600}.contact-block{background:#24473c;color:white;border-radius:38px;padding:65px;display:grid;grid-template-columns:1fr 1fr;gap:75px;align-items:center}.contact-block h2{font-size:clamp(36px,4vw,53px);line-height:1.12;letter-spacing:-2px;margin:14px 0}.contact-block p{color:#bacdc2}.form{background:white;padding:28px;border-radius:26px;display:grid;gap:13px;color:var(--ink)}.form label{font-size:11px;font-weight:650;display:block;margin-bottom:5px}.form input,.form select,.form textarea{width:100%;border:1px solid #e5e9e4;background:#fbfcfa;border-radius:10px;padding:13px;outline:none;color:#384940}.form textarea{resize:vertical;min-height:85px}.form button{width:100%;margin-top:4px}.footer{background:#182b25;color:#dde7de;padding:48px 0}.footer-top{display:flex;align-items:center;justify-content:space-between;gap:30px}.foot-links{display:flex;flex-wrap:wrap;gap:22px;font-size:12px;color:#c2d0c5}.foot-bottom{border-top:1px solid #ffffff1c;margin-top:35px;padding-top:21px;display:flex;justify-content:space-between;color:#a8b8ac;font-size:11px}.page-hero{padding:115px 0 70px}.page-hero h1{font-size:clamp(46px,6vw,76px);line-height:1.05;letter-spacing:-3.7px;margin:15px 0}.page-hero p{max-width:560px;color:var(--muted)}.split{display:grid;grid-template-columns:1fr 1fr;gap:65px;align-items:center}.split .placeholder{height:375px}.bullets{display:grid;gap:15px;padding:0;list-style:none}.bullets li{padding:13px 0;border-bottom:1px solid var(--line)}.subtle{color:var(--muted)}.end-cta{display:flex;justify-content:space-between;align-items:center;background:#e7eee7;border-radius:30px;padding:50px;gap:30px}.end-cta h2{margin:0;font-size:32px;letter-spacing:-1.2px}.mini-note{font-size:11px;letter-spacing:.2px;color:#8c9a91}#mobile-menu{display:none}.overlay{position:fixed;bottom:20px;left:20px;background:#162b22e8;color:white;font-size:12px;padding:10px 15px;border-radius:100px;z-index:11;box-shadow:0 8px 20px #0002}.overlay strong{font-weight:650}#toast{display:none;position:fixed;bottom:75px;left:50%;transform:translateX(-50%);background:white;border:1px solid var(--line);padding:14px 22px;box-shadow:0 8px 26px #0002;border-radius:14px;z-index:12;font-size:13px}
@media(max-width:850px){.container{width:min(100% - 32px,1150px)}.nav{height:64px}.links,.nav>.cta{display:none}.hamb{display:block;margin-left:auto}.nav-shell{top:7px;padding-top:8px}.hero{grid-template-columns:1fr;min-height:auto;padding:78px 0 70px;gap:45px}.hero h1{font-size:59px;letter-spacing:-3.5px}.hero-img{height:340px}.section{padding:75px 0}.grid.four,.grid.three{grid-template-columns:repeat(2,1fr)}.process{grid-template-columns:repeat(2,1fr)}.contact-block{grid-template-columns:1fr;padding:37px;gap:30px}.split{grid-template-columns:1fr;gap:28px}.page-hero{padding:75px 0 45px}.end-cta{padding:35px;align-items:start;flex-direction:column}#mobile-menu.show{display:flex;flex-direction:column;gap:5px;background:white;position:absolute;left:16px;right:16px;top:82px;padding:16px;border:1px solid var(--line);border-radius:21px;box-shadow:0 20px 45px #0001}#mobile-menu a{padding:10px 13px;border-radius:8px}}
@media(max-width:530px){.hero h1{font-size:48px}.hero-img{height:280px}.grid.four,.grid.three,.grid.two,.process{grid-template-columns:1fr}.service .placeholder{height:190px}.section-head h2{font-size:37px}.contact-block{padding:28px 17px;border-radius:25px}.form{padding:18px}.footer-top,.foot-bottom{flex-direction:column;align-items:flex-start}.overlay{bottom:10px;left:10px;font-size:10px}.page-hero h1{font-size:48px}.end-cta h2{font-size:28px}}
</style>
</head>
<body><div class="nav-shell container"><nav class="nav"><a href="#/" class="logo"><span class="mark">⌂</span>TĪRAS MĀJAS</a><div class="links" id="navlinks"></div><a class="cta" href="#/kontakti">Pieteikt apsekošanu ↗</a><button class="hamb" onclick="document.getElementById('mobile-menu').classList.toggle('show')" aria-label="Atvērt izvēlni">☰</button></nav><div id="mobile-menu"></div></div><main id="app"></main><footer class="footer"><div class="container"><div class="footer-top"><a class="logo" href="#/"><span class="mark">⌂</span>TĪRAS MĀJAS</a><div class="foot-links"><a href="#/">Sākums</a><a href="#/pakalpojumi">Pakalpojumi</a><a href="#/musu-darbi">Mūsu darbi</a><a href="#/kontakti">Kontakti</a></div></div><div class="foot-bottom"><span>© Tīras Mājas — demo struktūra</span><span>Kontaktinformācija · Juridiskā informācija · Privātums</span></div></div></footer><div class="overlay"><strong>DEMO</strong> · struktūra bez gala satura</div><div id="toast"></div>
<script>
const services=[['Kanalizācijas izbūve','kanalizacija'],['Ūdensapgāde','udensapgade'],['Apkures sistēmas','apkure'],['Teritorijas labiekārtošana','labiekartosana']];
const ph=(label='VIETA UZŅĒMUMA FOTO',cls='')=>`<div class="placeholder ${cls}"><span>${label}</span></div>`;
const head=(tag,title,desc='')=>`<div class="section-head"><div class="eyebrow">${tag}</div><h2>${title}</h2>${desc?`<p>${desc}</p>`:''}</div>`;
const card=([name,slug])=>`<a class="service" href="#/pakalpojumi/${slug}">${ph('PAKALPOJUMA FOTO')}<div class="service-bottom"><strong>${name}</strong><span class="arrow">↗</span></div></a>`;
const serviceGrid=()=>`<div class="grid four">${services.map(card).join('')}</div>`;
const projects=(n=3)=>`<div class="grid three">${Array.from({length:n},(_,i)=>`<a class="project" href="#/musu-darbi">${ph('REĀLS PAVEIKTĀ DARBA FOTO')}<p>Projekts ${String(i+1).padStart(2,'0')} <span class="subtle">↗</span></p></a>`).join('')}</div>`;
const steps=()=>`<div class="process">${['Pieteikums','Apsekošana','Tāme','Darbu izpilde'].map((t,i)=>`<div class="step"><small>0${i+1}</small><h3>${t}</h3><p>Īss procesa apraksts</p></div>`).join('')}</div>`;
const contactForm=()=>`<form class="form" onsubmit="event.preventDefault();toast('Demo forma — dati netiek nosūtīti')"><div><label>Vārds</label><input placeholder="Vārds" required></div><div><label>Telefons</label><input type="tel" placeholder="Tālruņa numurs" required></div><div><label>Pakalpojums</label><select required><option value="">Izvēlies pakalpojumu</option>${services.map(([n])=>`<option>${n}</option>`).join('')}</select></div><div><label>Objekta atrašanās vieta</label><input placeholder="Pilsēta / novads"></div><div><label>Komentārs</label><textarea placeholder="Īss darbu apraksts"></textarea></div><button class="cta">Pieteikt apsekošanu ↗</button><div class="mini-note">Demonstrācijas režīms — forma pagaidām nesūta datus.</div></form>`;
const contactSection=()=>`<section class="section" id="pieteikums"><div class="container"><div class="contact-block"><div><div class="eyebrow" style="color:#c2d6ca">PIETEIKUMS</div><h2>Pieteikt bezmaksas apsekošanu</h2><p>Šeit būs apstiprinātais skaidrojums par pieteikšanos un saziņu.</p><div class="actions"><a class="cta secondary" href="#/kontakti">Kontakti ↗</a></div></div>${contactForm()}</div></div></section>`;
const home=()=>`<div class="container hero"><div><div class="eyebrow">INŽENIERKOMUNIKĀCIJAS · BŪVDARBI</div><h1>Tīras Mājas.</h1><p>Vieta uzņēmuma galvenajam pakalpojuma skaidrojumam un darbības reģionam.</p><div class="actions"><a href="#pieteikums" class="cta" onclick="scrollToForm(event)">Pieteikt apsekošanu ↗</a><a href="#/pakalpojumi" class="cta secondary">Pakalpojumi ↗</a></div></div>${ph('GALVENAIS UZŅĒMUMA FOTO','hero-img')}</div>
<section class="section alt"><div class="container">${head('PAKALPOJUMI','Ko mēs darām')}${serviceGrid()}</div></section>
<section class="section"><div class="container">${head('PAR UZŅĒMUMU','Kāpēc izvēlēties mūs')}<div class="grid three">${[['01','Pieredze'],['02','Garantijas'],['03','Bezmaksas apsekošana']].map(([n,t])=>`<div class="trust"><span class="num">${n}</span><strong>${t}</strong><small>Šeit būs pārbaudīts fakts vai pierādījums.</small></div>`).join('')}</div></div></section>
<section class="section alt"><div class="container">${head('MŪSU DARBI','Paveiktie projekti')}${projects()}<div style="margin-top:30px"><a href="#/musu-darbi" class="cta secondary">Skatīt visus darbus ↗</a></div></div></section>
<section class="section"><div class="container">${head('SADARBĪBA','Četri vienkārši soļi')}${steps()}</div></section>
<section class="section alt"><div class="container">${head('ATSAUKSMES','Klientu pieredze')}<div class="grid three">${[1,2,3].map(i=>`<div class="quote"><div class="bars"><span class="bar"></span><span class="bar"></span><span class="bar short"></span></div><strong>Klienta atsauksme ${i}</strong><div class="mini-note">Tikai ar klienta atļauju</div></div>`).join('')}</div></div></section>${contactSection()}`;
const allServices=()=>`<div class="container page-hero"><div class="eyebrow">PAKALPOJUMI</div><h1>Mūsu pakalpojumi</h1><p>Īss, apstiprināts piedāvājuma apraksts.</p></div><section class="section alt"><div class="container">${serviceGrid()}</div></section>${contactSection()}`;
const servicePage=(slug)=>{const item=services.find(s=>s[1]===slug);if(!item)return notFound();return `<div class="container page-hero"><div class="eyebrow"><a href="#/pakalpojumi">PAKALPOJUMI</a> / ${item[0].toUpperCase()}</div><h1>${item[0]}</h1><p>Šeit paredzēts īss pakalpojuma apraksts, balstoties tikai uz uzņēmuma apstiprināto informāciju.</p><div class="actions"><a href="#pieteikums" onclick="scrollToForm(event)" class="cta">Pieteikt apsekošanu ↗</a></div></div><section class="section alt"><div class="container split"><div>${head('PAKALPOJUMS','Ko ietver darbi')}<ul class="bullets"><li>Darbu veids / pakalpojuma pozīcija</li><li>Darbu veids / pakalpojuma pozīcija</li><li>Darbu veids / pakalpojuma pozīcija</li></ul></div>${ph('ATBILSTOŠS DARBA FOTO')}</div></section><section class="section"><div class="container">${head('PIEREDZE','Saistīts paveiktais darbs')}${projects(3)}</div></section><section class="section alt"><div class="container">${head('PROCESS','Kā notiek sadarbība')}${steps()}</div></section>${contactSection()}`};
const works=()=>`<div class="container page-hero"><div class="eyebrow">PORTFOLIO</div><h1>Mūsu darbi</h1><p>Šeit būs reālu paveikto darbu fotogrāfijas un īsi apraksti.</p></div><section class="section alt"><div class="container">${projects(6)}</div></section>${contactSection()}`;
const contacts=()=>`<div class="container page-hero"><div class="eyebrow">KONTAKTI</div><h1>Sazināsimies</h1><p>Apstiprinātais uzņēmuma telefons, e-pasts un darbības teritorija.</p></div><section class="section alt"><div class="container split"><div>${head('SAZIŅA','Kontaktinformācija')}<ul class="bullets"><li>Telefons — tiks precizēts</li><li>E-pasts — tiks precizēts</li><li>Apkalpošanas teritorija — tiks precizēta</li></ul></div>${ph('VIETA KONTAKTU / OBJEKTA FOTO')}</div></section>${contactSection()}`;
const notFound=()=>`<div class="container page-hero"><h1>Lapa nav atrasta</h1><a href="#/" class="cta">Atpakaļ uz sākumu</a></div>`;
function scrollToForm(e){e.preventDefault();document.getElementById('pieteikums')?.scrollIntoView({behavior:'smooth',block:'start'})}
function toast(str){const t=document.getElementById('toast');t.textContent=str;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
function route(){const path=(location.hash.replace(/^#\/ ?/,'')||'').replace(/^\//,'').split('#')[0];const seg=path.split('/').filter(Boolean);let markup= !seg.length?home():seg[0]==='pakalpojumi'?(seg[1]?servicePage(seg[1]):allServices()):seg[0]==='musu-darbi'?works():seg[0]==='kontakti'?contacts():notFound();document.getElementById('app').innerHTML=markup;const links=[['Sākums','#/'],['Pakalpojumi','#/pakalpojumi'],['Mūsu darbi','#/musu-darbi'],['Kontakti','#/kontakti']];document.getElementById('navlinks').innerHTML=links.map(([n,h])=>`<a class="${((!seg.length&&h==='#/')||(seg[0]&&h.includes(seg[0])))?'active':''}" href="${h}">${n}</a>`).join('');document.getElementById('mobile-menu').innerHTML=links.map(([n,h])=>`<a href="${h}" onclick="document.getElementById('mobile-menu').classList.remove('show')">${n}</a>`).join('')+`<a class="cta" href="#/kontakti">Pieteikt apsekošanu ↗</a>`;window.scrollTo({top:0,behavior:'instant'})}window.addEventListener('hashchange',route);route();
</script></body></html>
